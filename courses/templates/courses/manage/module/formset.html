{% extends "base.html" %}

{% block title %}
  Edit "{{ course.title }}"
{% endblock %}

{% block content %}
  <h1>Edit "{{ course.title }}"</h1>
  <div class="module">
    <h2>Course modules</h2>
    <div class="form-details formset-container">
      <form method="post">
        {{ formset }}
        {{ formset.management_form }}
        {% csrf_token %}
        <p style="margin-top: 24px;"><input type="submit" value="Save modules"></p>
      </form>
    </div>
  </div>
{% endblock %}
