{% extends "base.html" %}

{% block title %}Delete course{% endblock %}

{% block content %}
  <h1>Delete course "{{ object.title }}"</h1>
  <div class="module">
    <form action="" method="post">
      {% csrf_token %}
      <p style="margin-bottom: 20px; font-size: 16px;">Are you sure you want to delete <strong>"{{ object.title }}"</strong>?</p>
      <div style="display: flex; gap: 12px; align-items: center;">
        <input type="submit" value="Confirm" class="button button-danger">
        <a href="{% url "manage_course_list" %}" class="button button-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
