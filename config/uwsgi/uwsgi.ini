[uwsgi]
# Variables
projectname = elearn
base = /home/env/elearn

# Configuration
master = true
virtualenv = /home/env/educa
pythonpath = %(base)
chdir = %(base)
env = DJANGO_SETTINGS_MODULE=%(projectname).settings.pro
module = %(projectname).wsgi:application
socket = /tmp/%(projectname).sock
chmod-socket = 666
vacuum = true
processes = 4
threads = 2
harakiri = 60
max-requests = 5000
